# Replace game.example.com with your own DNS name before enabling this site.
# certbot --nginx -d game.example.com adds HTTPS after DNS and ports 80/443 are ready.
server {
    listen 80;
    server_name game.example.com;
    root /var/www/shanhai/current;
    index index.html;
    charset utf-8;

    # The game loader fetches .gz itself and streams decompression.
    gzip off;
    gzip_static off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ~ \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ \.pck$ {
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ \.gz$ {
        default_type application/gzip;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
